<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Sistema Soporte</title>
</head>
<body>
    <h1>Listado de Tickets</h1>
    <ul id="lista"></ul>

    <script>
        fetch('/api/tickets')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Error al obtener los tickets');
                }
                return response.json();
            })
            .then(data => {
                const lista = document.getElementById('lista');
                lista.innerHTML = ''; // Limpiar lista previa

                data.forEach(ticket => {
                    const li = document.createElement('li');

                    // Manejo seguro de propiedades (camelCase o PascalCase)
                    const codigo = ticket.codigo || ticket.Codigo || 'S/C';
                    const titulo = ticket.titulo || ticket.Titulo || 'Sin título';
                    const estado = ticket.estado || ticket.Estado || 'Desconocido';

                    li.textContent = `${codigo} - ${titulo} (${estado})`;
                    lista.appendChild(li);
                });
            })
            .catch(error => console.error('Error al cargar los tickets:', error));
    </script>
</body>
</html>
